<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino Runner - Made by Nikhil</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #fff;
  font-family: Arial, sans-serif;
}
canvas { display: block; }

/* UI */
.ui {
  position: fixed;
  top: 10px;
  left: 15px;
  font-weight: bold;
  font-size: 16px;
  color: #222;
}
.top-right {
  position: fixed;
  top: 10px;
  right: 15px;
  font-weight: bold;
  cursor: pointer;
}
.center {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: bold;
  text-align: center;
}
.hidden { display: none; }

/* MOBILE CONTROLS */
.controls {
  position: fixed;
  bottom: 20px;
  width: 100%;
  display: flex;
  justify-content: space-between;
  padding: 0 20px;
  box-sizing: border-box;
}
.btn {
  width: 120px;
  height: 60px;
  background: rgba(0,0,0,0.6);
  color: #fff;
  font-size: 18px;
  font-weight: bold;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div class="ui" id="score">SCORE: 0</div>
<div class="ui" style="top:32px" id="high">HIGH: 0</div>
<div class="top-right" id="mute">🔊</div>

<div class="center" id="start">PRESS SPACE / TAP TO START</div>
<div class="center hidden" id="over">GAME OVER<br>PRESS R / TAP TO RESTART</div>

<div class="controls">
  <div class="btn" id="jumpBtn">JUMP</div>
  <div class="btn" id="duckBtn">DUCK</div>
</div>

const muteBtn = document.getElementById("mute");

  muted = !muted;
  muteBtn.textContent = muted ? "🔇" : "🔊";
  if (muted) bgMusic.pause();
  else if (state === "RUNNING") bgMusic.play();
};

function spawnObstacle() {

  obstacles.push(o);
}

function jump() {
  if (!dino.jumping) { dino.vy = -16; dino.jumping = true; }
}
